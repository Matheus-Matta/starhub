# Producao do StarHub com a imagem gerada pelo GitHub (.github/workflows/docker.yml).
# O PostgreSQL fica de fora (POSTGRES_* no .env); o Redis sobe aqui.
#
#   docker compose pull && docker compose up -d     # sobe tudo
#   docker compose logs -f web-blue web-green worker
#
# Dois backends, blue e green, cada um na sua porta (WEB_PORT_BLUE e WEB_PORT_GREEN): o
# balanceador de fora reparte entre as duas. Ligue nele a checagem de saude (porta
# aberta) ou o "tentar o outro em caso de erro": sem isso, a requisicao que cai num
# backend parado espera ate o timeout. Atualizacao sem tirar o site do ar, um por vez:
#
#   docker compose pull
#   docker compose up -d --no-deps web-blue      # espera ficar healthy (docker compose ps)
#   docker compose up -d --no-deps web-green
#   docker compose up -d --no-deps worker beat
#
# Ordem na primeira subida: redis -> web-blue e web-green (cada um roda `migrar` ao subir:
# trava no banco, um migra por vez; depois o uvicorn) -> worker e beat.
name: starhub

# Logs do Docker com teto: 2 arquivos de 8 MB por container (o mais velho e apagado
# quando enche). 5 containers (web-blue, web-green, worker, beat, redis) x 16 MB
# = 80 MB no maximo, abaixo do limite de 100 MB do servidor. Container novo aqui: usa o
# mesmo &logs e refaca a conta (a soma tem que continuar abaixo de 100 MB).
x-logs: &logs
  driver: json-file
  options:
    max-size: "8m"
    max-file: "2"

x-app: &app
  image: ${STARHUB_IMAGE:-ghcr.io/matheus-matta/starhub:latest}
  env_file: .env
  environment:
    # O .env do dev diz config.settings.dev: aqui vale sempre o de producao.
    DJANGO_SETTINGS_MODULE: config.settings.prod
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  volumes:
    # Fotos de avaliacao e imagens importadas: o worker grava, blue e green servem.
    - media:/app/media
  restart: unless-stopped
  logging: *logs

# Backend web (comando padrao da imagem: `migrar` e depois o uvicorn).
x-web: &web
  <<: *app
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    # So a porta: ALLOWED_HOSTS e o redirect https recusariam um GET em localhost.
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    # Primeira subida de uma versao com muitas migrations: o migrate vem antes da porta.
    start_period: 120s

services:
  web-blue:
    <<: *web
    ports:
      - "${WEB_PORT_BLUE:-8001}:8000"

  web-green:
    <<: *web
    ports:
      - "${WEB_PORT_GREEN:-8002}:8000"

  worker:
    <<: *app
    command: sh -c "celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-4}"
    depends_on:
      redis:
        condition: service_healthy
      # Blue saudavel = `migrar` terminou: o banco ja esta na versao da imagem.
      web-blue:
        condition: service_healthy

  beat:
    <<: *app
    # Hoje nao ha tarefa agendada; fica pronto para quando houver (CELERY_BEAT_SCHEDULE).
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      web-blue:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    logging: *logs
    # appendonly: fila do Celery e resultados sobrevivem a um reinicio do Redis.
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  media:
  redis:
