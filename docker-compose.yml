# Producao do StarHub com a imagem gerada pelo GitHub (.github/workflows/docker.yml).
# PostgreSQL e Redis sobem aqui (POSTGRES_* no .env; POSTGRES_HOST=postgres). Banco de
# fora: aponte POSTGRES_HOST para ele e suba sem o servico postgres.
#
#   docker compose pull && docker compose up -d     # sobe tudo
#   docker compose logs -f web-blue web-green worker
#
# Dois backends, blue e green, cada um na sua porta (WEB_PORT_BLUE e WEB_PORT_GREEN): o
# balanceador de fora reparte entre as duas. Ligue nele a checagem de saude (porta
# aberta) ou o "tentar o outro em caso de erro": sem isso, a requisicao que cai num
# backend parado espera ate o timeout. Atualizacao sem tirar o site do ar, um por vez:
#
#   docker compose pull
#   docker compose up -d --no-deps web-blue
#   docker compose logs --tail=100 web-blue      # confirme "Uvicorn running"
#   docker compose up -d --no-deps web-green
#   docker compose up -d --no-deps worker beat
#
# Ordem na primeira subida: postgres e redis -> web-blue e web-green (cada um roda, ao
# subir, `criar_banco` (POSTGRES_DB, se faltar) e `migrar` (trava no banco, um migra por
# vez); depois o uvicorn) -> worker e beat.
name: starhub

# Logs do Docker com teto: 2 arquivos de 8 MB por container (o mais velho e apagado
# quando enche). 6 containers (web-blue, web-green, worker, beat, redis, postgres)
# x 16 MB = 96 MB no maximo, abaixo do limite de 100 MB do servidor. Container novo aqui: usa o
# mesmo &logs e refaca a conta (a soma tem que continuar abaixo de 100 MB).
x-logs: &logs
  driver: json-file
  options:
    max-size: "8m"
    max-file: "2"

x-app: &app
  image: ${STARHUB_IMAGE:-ghcr.io/matheus-matta/starhub:latest}
  env_file: .env
  environment:
    # O .env do dev diz config.settings.dev: aqui vale sempre o de producao.
    DJANGO_SETTINGS_MODULE: config.settings.prod
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  volumes:
    # Fotos de avaliacao e imagens importadas: o worker grava, blue e green servem.
    - media:/app/media
  restart: unless-stopped
  logging: *logs

# Backend web (comando padrao da imagem: `migrar` e depois o uvicorn).
x-web: &web
  <<: *app
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  web-blue:
    <<: *web
    ports:
      - "${WEB_PORT_BLUE:-8001}:8000"

  web-green:
    <<: *web
    ports:
      - "${WEB_PORT_GREEN:-8002}:8000"

  worker:
    <<: *app
    command: sh -c "celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-4}"
    depends_on:
      redis:
        condition: service_healthy
      # Aguarda o container web iniciar, sem depender de healthcheck HTTP.
      web-blue:
        condition: service_started

  beat:
    <<: *app
    # Hoje nao ha tarefa agendada; fica pronto para quando houver (CELERY_BEAT_SCHEDULE).
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      web-blue:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    logging: *logs
    # Os mesmos nomes do .env do app: a imagem cria o usuario e o POSTGRES_DB na primeira
    # subida (volume vazio). Volume que ja existe: o `criar_banco` do web cria o que faltar.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starhub}
      POSTGRES_USER: ${POSTGRES_USER:-starhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    logging: *logs
    # appendonly: fila do Celery e resultados sobrevivem a um reinicio do Redis.
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  media:
  redis:
  postgres:
