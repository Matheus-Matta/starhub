services:
  agent:
    image: portainer/agent:lts
    ports:
      - "9001:9001"
    environment:
      AGENT_SECRET: ${AGENT_SECRET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"