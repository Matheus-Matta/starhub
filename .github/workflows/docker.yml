# Testa e gera a imagem Docker do StarHub no GitHub Container Registry (ghcr.io).
#
#   push na main      -> testes + imagem :latest e :sha-<commit>
#   tag 1.2.3/v1.2.3  -> testes + imagem :1.2.3 (ou :v1.2.3)
#   pull request      -> testes + build da imagem (sem publicar)
#
# O docker-compose.yml usa ghcr.io/<dono>/starhub:latest (STARHUB_IMAGE no .env troca).
name: Imagem Docker

on:
  push:
    branches: [main]
    # 1.0.0 ou v1.0.0: a imagem sai com a tag igual a do git.
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes e checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/check_tamanho_de_arquivo.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q -p no:warnings

  imagem:
    name: Imagem
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O registry so aceita nome minusculo (o dono do repo tem maiusculas).
      - run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
