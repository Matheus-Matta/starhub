<span class="table-identity table-product">
  <span class="table-identity-media table-product-thumb">
    {% if imagem_url %}
      <img src="{{ imagem_url }}" alt="" loading="lazy">
    {% elif icone %}
      {% icone icone %}
    {% else %}
      {% icone "package" %}
    {% endif %}
  </span>
  <span class="table-identity-copy">
    <span class="table-identity-title" title="{{ nome }}">{{ nome }}</span>
    <span class="table-identity-meta">{% if meta %}{{ meta }}{% else %}SKU: {{ sku }}{% endif %}</span>
  </span>
</span>
